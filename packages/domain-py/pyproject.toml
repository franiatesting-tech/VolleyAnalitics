[project]
name = "volley-domain"
version = "0.1.0"
description = "Shared domain models, schemas, and synthetic match generator for Volley Intelligence (used by services/api and services/worker)."
requires-python = ">=3.11,<3.12"
dependencies = [
  "sqlalchemy>=2.0,<3.0",
  "pydantic>=2.7,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volley_domain"]

[dependency-groups]
dev = [
  "pytest>=8.0",
]
