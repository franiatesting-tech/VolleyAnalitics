[project]
name = "volley-storage"
version = "0.1.0"
description = "StorageAdapter abstraction (local filesystem dev / Cloudflare R2 prod) for Volley Intelligence -- see CLAUDE.md's Storage fixed decision and docs/architecture/DATA_FLOW.md's upload lifecycle."
requires-python = ">=3.11,<3.12"
dependencies = [
  "boto3>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volley_storage"]

[dependency-groups]
dev = [
  "pytest>=8.0",
]
