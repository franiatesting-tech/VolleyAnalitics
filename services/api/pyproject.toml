[project]
name = "volley-api"
version = "0.1.0"
description = "FastAPI backend for Volley Intelligence."
requires-python = ">=3.11,<3.12"
dependencies = [
  "volley-domain",
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0,<3.0",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "celery>=5.4",
  "redis>=5.0",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volley_api"]

[tool.uv.sources]
volley-domain = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "aiosqlite>=0.20",
]
